<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Responsive QA — O’Brien Solicitors</title><style>body{margin:0;font:14px Arial;background:#e3e7e9}header{position:sticky;top:0;z-index:2;background:#e3e7e9;padding:14px 20px;display:flex;gap:12px;align-items:center}button,select{padding:9px;border:1px solid #889;background:white;font:inherit}iframe{height:1250px;border:0;background:white;display:block;margin:10px auto}#view{width:390px}</style></head><body><header><strong>Responsive review</strong><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1160">1160 px</button><select id="route" aria-label="Page"><option value="index.html">Home</option><option value="conveyancing.html">Conveyancing</option><option value="contact.html">Contact</option><option value="practice-areas.html">Practice areas</option><option value="about.html">About</option></select><button id="text-size">200% text</button></header><iframe id="view" src="../../index.html" title="Responsive website preview"></iframe><script>const view=document.querySelector('#view');for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>view.style.width=b.dataset.width+'px';document.querySelector('#text-size').onclick=()=>{const el=view.contentDocument.documentElement;el.style.fontSize=el.style.fontSize?'':'200%';};document.querySelector('#route').onchange=e=>view.src='../../'+e.target.value;</script></body></html>
